<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Register User</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="register.html" data-testid="nav-register">Register User</a>
    <a href="transaction.html" data-testid="nav-transactions">Transactions</a>
  </nav>
  <main>
    <h1>Register User</h1>
    <div class="card">
      <form id="register-form" data-testid="register-form">
        <label for="name">Name</label>
        <input id="name" name="name" data-testid="register-name" required />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" data-testid="register-email" required />

        <label for="accountType">Account Type</label>
        <select id="accountType" name="accountType" data-testid="register-account-type">
          <option value="basic">Basic</option>
          <option value="premium">Premium</option>
        </select>

        <button type="submit" data-testid="register-submit">Create User</button>
      </form>
      <div id="register-message" class="message" data-testid="register-message"></div>
      <div id="register-result" data-testid="register-result"></div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
